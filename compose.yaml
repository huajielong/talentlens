services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4173
      PUBLIC_URL: https://${DOMAIN:?Set DOMAIN in .env}
      TALENTLENS_DATA_DIR: /app/data
      TRUST_PROXY: "1"
    volumes:
      - ./data:/app/data
    expose:
      - "4173"
    mem_limit: 1g
    init: true
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
